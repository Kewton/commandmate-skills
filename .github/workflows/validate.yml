name: validate

# Runs on every change that could reach a release. A package that fails here can
# never be built by `release.yml`, which runs the identical checks again against
# the tagged commit rather than trusting this run's verdict.
on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Read-only by default. Nothing in this workflow needs to write to the
# repository, and a pull request from a fork must never receive a token that
# could.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: schema, file set, digests, secrets, reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pipeline is stdlib-only Python on purpose: no dependency is fetched
      # here, so an unavailable or compromised registry cannot change what CI
      # concludes about a package. `ubuntu-latest` ships python3 already.
      - name: Record the toolchain
        run: python3 --version

      - name: Validate every Skill package and Catalog document
        run: python3 scripts/validate.py

      - name: Validate the pipeline fixture package
        run: python3 scripts/validate.py --skills-root tests/fixtures/skills

      - name: Run the pipeline's own tests
        run: python3 scripts/selftest.py

      # Lives in this job rather than `runner-suites` because it is stdlib-only
      # Python and so keeps that property intact — it needs no toolchain of its
      # own. It is here at all because of #70: the grader and its samples had
      # shipped since cmate-repository-analysis 0.1.0 and nothing ever ran them,
      # so the check that rejects a result leaking a fixture secret was never
      # exercised in CI. Same defect class as #57 and #69.
      - name: Run the cmate-repository-analysis grader selftest
        run: python3 tests/fixtures/cmate-repository-analysis/check_result.py --selftest

      # A release must be buildable from the reviewed commit, not only from the
      # author's machine. This is a dry run: nothing is uploaded and no tag is
      # created, so it is safe to run on an untrusted pull request.
      - name: Dry-run the release build for the fixture package
        run: |
          python3 scripts/build_release.py \
            --skill pipeline-selftest \
            --skills-root tests/fixtures/skills \
            --out "${RUNNER_TEMP}/dist" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "validate-dry-run" \
            --commit "${GITHUB_SHA}"

      - name: Confirm the dry-run artifact reproduces on a second build
        run: |
          python3 scripts/build_release.py \
            --skill pipeline-selftest \
            --skills-root tests/fixtures/skills \
            --out "${RUNNER_TEMP}/dist-again" \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "validate-dry-run" \
            --commit "${GITHUB_SHA}"
          diff "${RUNNER_TEMP}/dist/pipeline-selftest-0.1.0.tar.gz" \
               "${RUNNER_TEMP}/dist-again/pipeline-selftest-0.1.0.tar.gz"

  # The runner suites live in their own job so the `validate` job above keeps its
  # stated property: stdlib-only Python, no toolchain fetched. These suites need
  # Node, so they pay for it separately.
  #
  # They are here because until now NOTHING ran them: not this workflow, and not
  # `.commandmate/verify.yaml`. A change that broke every planner case still got
  # a green PR and a green `commandmate verify` (#49-#52 were four such defects,
  # and merging two independently-green branches broke 7 assertions). A gate that
  # only exists on a maintainer's laptop is not a gate.
  runner-suites:
    name: runner and fixture suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runners declare `>=22.0.0` in their manifests; pin the same major
      # here so CI cannot pass on a Node the package says it does not support.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record the toolchain
        run: node --version

      - name: Run the cmate-orchestrate runner suite
        run: node tests/fixtures/cmate-orchestrate/run_tests.mjs

      - name: Run the cmate-issue-authoring runner suite
        run: bash tests/fixtures/cmate-issue-authoring/run_tests.sh

      - name: Run the cmate-orchestrate-monitor suite
        run: bash tests/fixtures/cmate-orchestrate-monitor/run_tests.sh

      - name: Run the cmate-verify selftest
        run: bash tests/fixtures/cmate-verify/run-tests.sh

      # #57 added this parity check — the awk parser in cmate-verify and the JS
      # parser in cmate-verify-advisor must accept the same options keys — and
      # nothing ever ran it. Wired here and in .commandmate/verify.yaml (#69).
      - name: Run the cmate-verify-advisor suite
        run: bash tests/fixtures/cmate-verify-advisor/run_tests.sh
