  - read-only
  - human-in-the-loop
  - commandmate-cli
compatibility:
  commandmate: '>=0.31.3 <1.0.0'
  agents:
    - agent: claude
      support: native
      evidence: Discovery path measured 2026-07-26 on Claude Code 2.1.220 with CommandMate 0.15.0 and re-checked 2026-07-31 - an installed skill is found under .claude/skills and matches in the slash palette. Package-independent; this package was NOT separately measured.
    - agent: codex
      support: native
      evidence: Discovery path measured 2026-07-26 on Codex CLI 0.145.0 and re-checked 2026-08-02 with a mechanical trace (the /skills picker lists it). No slash command is exposed, so invoke it by name with the agents and request fields. This package was NOT separately measured.
    - agent: opencode
      support: native
      evidence: 'Measured 2026-08-25 on opencode 1.18.22 (CommandMate#2037) and re-checked 2026-09-04 on 1.18.27: GET /skill lists SKILL.md from .agents/skills and .claude/skills; submitting /<name> loads the skill. Restart after install. This package was NOT separately measured.'
    - agent: command-code
      support: native
      evidence: 'Measured 2026-09-04 on Command Code 1.47.0 (CommandMate#2322): discovered from .agents/skills (cmd skills list, /skills picker); /<name> emits skill_loaded and runs. .claude/skills is not read. This package was NOT separately measured.'
    - agent: gemini
      support: unknown
      evidence: Not measured, for this package or any other. The procedure needs only a shell and the commandmate and git CLIs; discovery and reload are unverified.
    - agent: copilot
      support: unknown
      evidence: Not measured, for this package or any other. No discovery, invocation or reload behaviour has been observed, so no support level is claimed.
    - agent: antigravity
      support: unknown
      evidence: Not measured as the parent that loads this skill, for this package or any other. Its behaviour as a child session is recorded in SKILL.md section 11, which says nothing about discovery.
requirements:
  commands:
    - name: commandmate
      version_range: '>=0.31.3 <1.0.0'
    - name: git
      version_range: '>=2.30.0 <3.0.0'
  network_hosts: []
declared_permissions:
  - process_execution
  - filesystem_read
  - filesystem_write
  - environment_read
declared_risk: moderate
risk_rationale: >-
  script も実行 bit 付きの file も含まず、install 時に実行されるものも無い。手順が spawn するのは
  commandmate（whoami / instances / ls / ask、ask の無い版では send / wait / capture）と git（status /
  check-ignore / rev-parse）と tmux display-message だけで、respond / auto-yes / interrupt は使わない。
  子のコンポーザーへ文章を入力する。file を書くのは run-dir（.commandmate/workspace-research/<run-id>/）の
  中だけで、workspace の他の場所は変えない。読む環境変数は CM_WORKTREE_ID / CM_INSTANCE_ID で、
  credential は読まない。親は network に接続せず、Web の調査は子の CLI が行う。
