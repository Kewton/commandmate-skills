schema_version: 1
id: cmate-handoff
name: cmate-handoff
version: 0.1.0
summary: 次のセッションが環境から読み直せないもの（意図・次の一手・人への質問・決定・罠）を mem に残し、再開のときに brief から取り戻す手順。正本から導けるものは書かない。mode が on のブランチでだけ動く。
description: |-
  CommandMate の mem（ブランチごとの型付きの項目）を使って、セッションをまたいで作業を引き継ぐ手順である。目的は、次のセッション（次のあなた、あるいは別の Agent）が環境から読み直せないもの、すなわち意図・次の一手・人への質問とその答え待ち・人の決定・罠（試して駄目だったこと）を取り戻すことにある。
  本文は目的と書かないものを先に置く。Issue の本文・PR の状態・CI・diff・commit・relay・task や verify の結果は正本から毎回読めるので写さず、参照だけを --evidence に置く。同じことを複数の項目に書かない。kind の列挙は形の要件であって、書く中身を狭める規則ではない。
  入口で commandmate mem mode --json を 1 回読み、exit 0 かつ mode が on のときだけ使う。off・derived・未登録・曖昧・サーバ停止・mem を持たない古い CLI はすべて「使わない」で、正常として扱い、残りの手順を 1 行も実行しない。
  決定は人の言葉を --quote に引用して記録し、承認と正本への反映は人に頼む（CLI に promote の口は無い）。仕様を変える決定が未反映のうちは、それに依存する re-plan をしない。無人のときは人の決定を作らず、人への質問は next（--close-when manual）と --evidence で残す。区切りで mem check --suggest --quiet を呼んで自分の項目だけを見直し、再開では brief をデータとして読む。
capabilities:
  - commandmate mem mode --json を手順の頭で 1 回読み、exit 0 かつ mode が on のときだけ mem を使い、それ以外は何もせず正常に続ける
  - 目的（次のセッションが読み直せない意図・次の一手・人への質問・決定・罠）と書かないもの（正本から導けるもの）を本文の先頭に示す
  - 書く前に mem list で近い項目を探し、あれば --if-version 付きの update にして同じ話題を二重に書かない
  - kind と close_when を形の要件として選び、許されない組み合わせや長さの超過を exit code で読み分ける
  - 人の決定を --quote と --quote-at で引用して記録し、承認と正本への反映を人へ 1 行で頼み、自分では promote しない
  - 仕様を変える decision が recorded（未反映）のうちは、それに依存する re-plan をせず人へ返して止まる
  - 無人のときは人の決定を作らず、人への質問を next（--close-when manual）と --evidence で残す
  - 再開のとき brief をデータとして読み、省略された項目を --all で読み、古い可能性のある now と next を正本と突き合わせる
  - 区切りで mem check --suggest --quiet を呼び、促しが出たら自分の項目だけを見直す
  - 委任の返答待ちの waiting は cmate-delegate の send --note に任せ、他の Skill と同じ項目を書かない
expected_outcomes:
  - 次のセッションが、前のセッションの意図・次の一手・人への質問・決定・罠を brief から取り戻せる
  - Issue・PR・CI の状態の古い写しが、正本より強く読まれることがない
  - mem の mode が on でないブランチや mem を持たない CLI で、既存の作業が壊れず、失敗も報告されない
  - 人が言っていない決定が記録されず、未反映の決定に依存する re-plan が進まない
  - 同じ話題の項目が複数の Skill から二重に書かれない
provider:
  name: CommandMate
  url: https://github.com/Kewton/CommandMate
license: MIT
homepage: https://github.com/Kewton/commandmate-skills
keywords:
  - handoff
  - memory
  - mem
  - brief
  - resume
  - multi-session
  - decision
  - human-in-the-loop
  - unattended
  - commandmate-cli
compatibility:
  commandmate: '>=0.51.0 <1.0.0'
  agents:
    - agent: claude
      support: native
      evidence: Discovery path measured 2026-07-26 on Claude Code 2.1.220 with CommandMate 0.15.0, re-checked 2026-07-31 as a two-way control - an installed skill is found under .claude/skills and matches in the slash palette. Package-independent; this package was NOT separately measured.
    - agent: codex
      support: native
      evidence: Discovery path measured 2026-07-26 on Codex CLI 0.145.0 and re-checked 2026-08-02 with a mechanical trace (the /skills picker lists it). That version exposes no slash command, so invoke by name. This package was NOT separately measured.
    - agent: opencode
      support: native
      evidence: 'Measured 2026-08-25 on opencode 1.18.22 (CommandMate#2037) and re-checked 2026-09-04 on 1.18.27: GET /skill lists SKILL.md from .agents/skills and .claude/skills; submitting /<name> loads the skill. Scanned at boot, restart after install. This package was NOT separately measured.'
    - agent: command-code
      support: native
      evidence: 'Measured 2026-09-04 on Command Code 1.47.0 (CommandMate#2322): discovered from .agents/skills (cmd skills list, /skills picker); /<name> emits skill_loaded and runs. .claude/skills is not read; the installer''s .agents/skills copy suffices. This package was NOT separately measured.'
    - agent: antigravity
      support: native
      evidence: 'Measured 2026-09-16 on Antigravity CLI 1.2.3: /skills self-reports .agents/skills; /<name> returns a token from SKILL.md. Negative control: .claude/skills alone is never loaded. Trust the project first. Print mode NOT measured. Details in agent-support-matrix 3.5. This package NOT measured.'
    - agent: opencode-v2
      support: native
      evidence: 'Measured 2026-09-29 on opencode2 2.0.18 (CommandMate#2975): GET /api/skill lists SKILL.md from .agents/skills and .claude/skills; /<name> makes the model call the skill tool. No restart needed. Not in v2''s / palette (@ and /skills only). This package was NOT separately measured.'
    - agent: gemini
      support: unknown
      evidence: Not measured, for this package or any other. The procedure needs only a shell and the commandmate CLI, so it is usable by hand; discovery and reload are unverified.
    - agent: copilot
      support: unknown
      evidence: Not measured, for this package or any other. No discovery, invocation or reload behaviour has been observed, so no support level is claimed.
requirements:
  commands:
    - name: commandmate
      version_range: '>=0.51.0 <1.0.0'
  network_hosts: []
declared_permissions:
  - process_execution
declared_risk: moderate
risk_rationale: >-
  script も実行 bit 付きの file も含まず、install 時に実行されるものも無い。手順が spawn するのは
  commandmate の mem（mode / list / now / add / update / close / check）と brief だけで、
  書き込みは CommandMate のサーバが持つ mem の項目に限り、mode が on のブランチで自分の instance の
  項目だけに及ぶ。mem purge と mode の変更は使わない。file・commit・PR・merge・push は作らず、
  credential は読まない。network へは接続せず、commandmate CLI が local の API を叩くだけである。
