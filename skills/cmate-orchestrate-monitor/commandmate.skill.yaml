schema_version: 1
id: cmate-orchestrate-monitor
name: cmate-orchestrate-monitor
version: 0.3.0
summary: 並列 worker の完了判定を CommandMate の実行契約タスク状態（一次）と capture 分類（フォールバック）で下し、健全な worker へ入力を注入しない条件でのみ介入する監視レシピ。
description: >-
  tmux セッション上で走る worker（coding CLI）を監督するための、実運用で検証済みの監視レシピである。
  完了判定の一次ソースは CommandMate がサーバ側で検証ゲートを回した後に記録する実行契約の
  タスク状態であり（succeeded → COMPLETE、failed / cancelled → VERIFY_FAILED、not_started →
  NOT_STARTED）、capture の正規表現解析は契約なし委任および task 台帳を持たない CommandMate 向けの
  フォールバックである。判定順はペイン生存 veto → 裁定済みタスク状態 → STARTED ガード → idle 連続と
  実作業量、の順で固定してあり、ペイン生存 veto を先に置くのは前回 send の裁定で監視を打ち切らせない
  ため、非終局状態（pending / running / waiting_input / verifying）を短絡させずフォールバックへ落とすのは
  STARTED ガードを効かせ続けるためである。フォールバック経路では同梱の bash script が
  `commandmate capture <id> --json` の 1 フレームを 1 つの状態トークン（NOT_RUNNING / GENERATING /
  PROMPT / RATE_LIMIT / IDLE）へ落とす。アンカー照合は ANSI エスケープと NBSP を正規化したうえで
  「いま画面に出ている領域」に限定するため、スクロールバックに流れた作業指示文や spinner 行に
  誤マッチしない。分類順（NOT_RUNNING → リトライ backoff → PROMPT → GENERATING → RATE_LIMIT → IDLE）
  自体がガードで、各分岐は入力注入か抑止のどちらかを引き起こす。介入は 3 種類だけで、プロンプトの
  サイレント自動承認、usage limit バナー検出時の即時再開、リトライ枯渇後の上限つき再送に限られる。
  再送は IDLE かつ idle 閾値到達かつ現ペインに terminal API error があるときのみ発火し、上限到達後は
  オペレータへエスカレーションする。介入の宛先は固定 prefix の連結ではなく、そのポーリングの capture
  ペイロードの cliToolId から `mcbd-<cliToolId>-<worktree-id>[-<instance suffix>]` として導出するため、
  分類したペインと入力するペインが同一であることが構造的に保証され、claude と codex が混在する
  fleet でもフラグ無しで成立する。送信前に tmux has-session で完全一致指定（`=<name>:`）の存在を
  検証し、失敗は握り潰さず stderr へ報告する。ログは送信の結果を書き、承認カウンタと再送予算は
  配信できたときだけ動く。worktree-id は `<id>@<instance-id>` 形式で agent instance を指定でき、
  指定は capture 側と送信先の両方に効く。フォールバックの完了判定は STARTED ガードを持ち、生成アンカーを
  一度も観測していない idle や、commit も uncommitted も 0 の idle を COMPLETE と報告しない。
  タスク状態と作業量カウンタはどちらも差し替え可能なフックとして外部供給し（hooks-task.sh は
  `commandmate task list <id> --limit 1` の最新行を、hooks-git.sh は worktree-id を実 checkout へ
  解決して git から数える）、指定した hooks file が存在しない場合は黙ってスタブへ落ちずに即座に失敗する。
  タスク状態を配線したのに引けなかった場合は worker ごとに 1 度フォールバックモードを宣言してから
  推定へ降格する（黙って劣化しない）。--verbose は 1 ポーリング 1 行の固定フォーマットで、状態と完了
  判定に実際に渡した入力を機械可読に残す（既定出力は変わらない）。worker の作成・dispatch・作業指示の
  送信・PR 作成・merge・Issue の close は行わない。COMPLETE は監視を止めてよいという判定であって
  マージ可否の裁定ではなく、契約付き委任の最終裁定は `commandmate wait --verify` の exit code である。
capabilities:
  - 実行契約のタスク状態を一次ソースとして読み、終局状態だけで裁定する（failed / cancelled は COMPLETE と分けて VERIFY_FAILED）
  - ペイン生存 veto をタスク状態より先に、非終局状態をフォールバックより後に評価し、古い裁定と STARTED ガード無効化の両方を防ぐ
  - タスク状態を引けない CommandMate では worker ごとに 1 度宣言してからフォールバックモードへ入る（黙って劣化しない）
  - capture の 1 フレームを NOT_RUNNING / GENERATING / PROMPT / RATE_LIMIT / IDLE へ分類する（ANSI と NBSP を正規化し現ペインに限定するのでスクロールバックへ誤マッチしない）
  - 生成中・CLI 自身の backoff 中には注入せず、プロンプトのサイレント自動承認・usage limit からの即時再開・リトライ枯渇後の上限つき再送だけを行い、上限到達でエスカレーションする
  - 介入の宛先を capture ペイロードの cliToolId と `<worktree-id>@<instance-id>` 指定から導出し、分類したペインと入力するペインを一致させる（固定 prefix を連結しない。instance 指定は capture 側にも効く）
  - 送信前に tmux has-session で完全一致指定の存在を検証し、配信できなかった介入を握り潰さず報告する（承認カウンタと再送予算は配信時のみ進む）
  - フォールバック時は生成アンカーの観測有無と実 commit / uncommitted 数で STARTED ガード付きの完了判定を下す
  - タスク状態と完了カウンタを差し替え可能なフックとして供給し、指定 file が無ければ黙って続行せず失敗する
  - 1 ポーリング 1 行の固定フォーマットで判定とその入力を機械可読に残し、品質ゲートを exit code の実測で判定する
expected_outcomes:
  - 検証ゲート不合格の worker が COMPLETE と報告されず、マージ候補に混ざらない
  - 完了判定がサーバ側の裁定か推定かをログから区別でき、タスク状態を参照できない環境で黙って推定へ劣化することがない
  - 生成中の worker が idle と誤分類されず、思考が長い worker も停止扱いされない
  - 介入がプロンプト・usage limit・枯渇後の再送に限られ、健全な worker へ入力が注入されない
  - 介入が空振りのまま「送った」と記録されることがなく、claude / codex 混在でも非既定 instance でもフラグ無しで正しいペインへ届く
  - 未起動 worker や作業の痕跡が無い worker が COMPLETE と誤報されない
  - 完了判定の根拠（started / streak / commits / uncommitted / task）がログから読み取れる
  - 完了フック未配線のまま「全 worker 完了」と報告されることがなく、NOT_STARTED として露見する
  - 総ポーリング数・状態分類の分布・介入の全件が監視ログから機械的に取り出せる
  - 品質ゲートの非 0 終了が「テスト緑」の出力に隠されない
provider:
  name: CommandMate
  url: https://github.com/Kewton/CommandMate
license: MIT
homepage: https://github.com/Kewton/commandmate-skills
keywords:
  - monitoring
  - supervision
  - orchestration
  - worker
  - tmux
  - capture
  - completion
  - parallel
  - guard
  - bash
compatibility:
  commandmate: '>=0.15.0 <1.0.0'
  agents:
    - agent: claude
      support: native
      evidence: Measured 2026-07-26 on Claude Code 2.1.220 with CommandMate 0.15.0. An installed skill was discovered from .claude/skills and matched in the slash palette; the installer writes .agents/skills and .claude/skills byte-identically.
    - agent: codex
      support: native
      evidence: Measured 2026-07-26 on Codex CLI 0.145.0. It reads SKILL.md from .agents/skills (model self-report of the absolute path, not a mechanical trace). This version does not expose skills as slash commands; invoke by name or run the scripts.
    - agent: gemini
      support: unknown
      evidence: Not measured for this version. Readable as a procedure; discovery unverified.
    - agent: opencode
      support: unknown
      evidence: Not measured for this version. Readable as a procedure; discovery unverified.
requirements:
  commands:
    - name: bash
      version_range: '>=3.2.0'
    - name: commandmate
    - name: git
    - name: tmux
  network_hosts:
    - registry.npmjs.org
declared_permissions:
  - filesystem_read
  - filesystem_write
  - process_execution
  - network_access
declared_risk: high
risk_rationale: >-
  Ships executable scripts (high risk). The loop runs `commandmate capture` per poll and, with
  hooks wired, reads the task ledger and worker checkouts (git) read-only. It types into worker
  panes via tmux — Enter, "a" and the resend message only, each gated on a classification that
  rules out a live turn and delivered only to an existence-checked exact-match session derived from
  that poll. It never sends task text or mutates a repo. Network is the npx launcher, avoidable
  with CM=commandmate.
