compatibility:
  commandmate: '>=0.11.0 <1.0.0'
  agents:
    - agent: claude
      support: native
      evidence: Discovery path measured 2026-07-26 on Claude Code 2.1.220 with CommandMate 0.15.0 — an installed skill is found under .claude/skills and matches in the slash palette. The mechanism is package-independent; this package was not separately measured.
    - agent: codex
      support: native
      evidence: Discovery path measured 2026-07-26 on Codex CLI 0.145.0 — SKILL.md is read from .agents/skills (model self-report, not a mechanical trace). That version exposes no slash command, so invoke by name. This package was not separately measured.
    - agent: gemini
      support: unknown
      evidence: Not measured for this version. The package ships instructions only, so the procedure is readable and usable by hand; discovery and reload are unverified.
    - agent: opencode
      support: unknown
      evidence: Not measured for this version. The package ships instructions only, so the procedure is readable and usable by hand; discovery and reload are unverified.
requirements:
  commands:
    - name: git
    - name: gh
  network_hosts:
    - api.github.com
    - github.com
declared_permissions:
  - filesystem_read
  - filesystem_write
  - process_execution
  - network_access
declared_risk: moderate
risk_rationale: >-
  指示文だけで構成され、script も実行可能 file も含まず、install 時に実行されるものは無い。
  手順が書き込むのは、契約の scope.allow（単独利用なら合意した変更範囲）の内側の file と、
  証拠の markdown だけである。実行する command は git（read-only query と commit）、
  gh issue view（読み取りのみ）、および契約やリポジトリが宣言した検証ゲートであり、
  api.github.com へ到達する。push・PR 作成・merge・force push・履歴書き換え・
  scope 外の file 削除は手順として禁止している。したがって computed_risk と同じ moderate を申告する。
