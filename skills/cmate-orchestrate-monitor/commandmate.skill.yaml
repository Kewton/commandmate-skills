schema_version: 1
id: cmate-orchestrate-monitor
name: cmate-orchestrate-monitor
version: 0.6.1
summary: commandmate wait が見ない停滞（プロンプト待ち・rate limit・リトライ枯渇死）を capture の 1 フレームから検知して回収し、介入と判定の全件を機械可読なログに残す監視レシピ。契約付き dispatch の一次監督は cmate-orchestrate の wait ループで、本 Skill はその回収と可観測性のサイドカーである。
description: >-
  tmux セッション上で走る worker（coding CLI）を監督するための、実運用で検証済みの監視レシピである。
  この Skill の価値は完了判定そのものではなく（契約付き委任の最終裁定は `commandmate wait --verify` の
  exit code であり、監視が読むタスク状態はその写しである）、**wait からは見えない停滞の回収と
  可観測性**にある。すなわち、プロンプトで止まった worker・usage limit で止まった worker・
  CLI がリトライを使い切って死んだ worker を検知し、何をどのペインへ送ったか、何を送らずに保留したか、
  どの入力で完了判定を下したかを全件ログへ残す。同梱の bash script が
  `commandmate capture <id> --json` の 1 フレームを 1 つの状態トークン（NOT_RUNNING / GENERATING /
  PROMPT / RATE_LIMIT / IDLE）へ落とす。アンカー照合は ANSI エスケープと NBSP を正規化したうえで
  「いま画面に出ている領域」に限定するため、スクロールバックに流れた作業指示文や spinner 行に
  誤マッチしない。分類順（NOT_RUNNING → リトライ backoff → PROMPT → GENERATING → RATE_LIMIT → IDLE）
  自体がガードで、各分岐は入力注入か抑止のどちらかを引き起こす。介入は 3 種類だけで、条件つきの
  プロンプト承認、usage limit バナー検出時の即時再開、リトライ枯渇後の上限つき再送に限られる。
  プロンプトへの Enter は tmux ペインへ直接入りサーバの承認制御を通らないため、分類だけでは送らない。
  そのフレームの promptData が「デフォルト選択肢が承認である二択」を示したときだけ送り、
  契約 autoYes ポリシーがサーバ側で保留したもの・デフォルトの無い選択・promptData の無いフレーム・
  未知の型は Enter を送らず理由つきで 1 度だけ報告して held に数える。`--no-auto-approve` で全件保留に
  できる（契約付き dispatch を監督するときの形）。再送は IDLE かつ idle 閾値到達かつ現ペインに
  terminal API error があるときのみ発火し、上限到達後はオペレータへエスカレーションする。介入の宛先は
  固定 prefix の連結ではなく、そのポーリングの capture ペイロードの cliToolId から
  `mcbd-<cliToolId>-<worktree-id>[-<instance suffix>]` として導出するため、分類したペインと入力する
  ペインが同一であることが構造的に保証され、claude と codex が混在する fleet でもフラグ無しで成立する。
  送信前に tmux has-session で完全一致指定（`=<name>:`）の存在を検証し、失敗は握り潰さず stderr へ
  報告する。ログは送信の結果を書き、承認カウンタと再送予算は配信できたときだけ動く。worktree-id は
  `<id>@<instance-id>` 形式で agent instance を指定でき、指定は capture 側と送信先の両方に効く。
  監視を止めてよいかの判定は、ペイン生存 veto → 裁定済みタスク状態 → STARTED ガード → idle 連続と
  実作業量、の順で固定してある。タスク状態と作業量カウンタはどちらも差し替え可能なフックとして
  外部供給し（hooks-task.sh は `commandmate task list <id> --limit 1` の最新行を、hooks-git.sh は
  worktree-id を実 checkout へ解決して git から数える）、指定した hooks file が存在しない場合は
  黙ってスタブへ落ちずに即座に失敗する。タスク状態を配線したのに引けなかった場合は worker ごとに
  1 度フォールバックモードを宣言してから推定へ降格する（黙って劣化しない）。--verbose は
  1 ポーリング 1 行の固定フォーマットで、状態と完了判定に実際に渡した入力を機械可読に残す
  （既定出力は変わらない）。worker の作成・dispatch・作業指示の送信・PR 作成・merge・Issue の close は
  行わない。COMPLETE は監視を止めてよいという判定であってマージ可否の裁定ではない。
capabilities:
  - 実行契約のタスク状態を一次ソースとして終局状態だけで裁定し（failed / cancelled は VERIFY_FAILED）、ペイン生存 veto をその前に・非終局状態をフォールバックの後に置いて古い裁定と STARTED ガード無効化を防ぐ
  - タスク状態を引けない CommandMate では worker ごとに 1 度宣言してからフォールバックモードへ入る（黙って劣化しない）
  - capture の 1 フレームを NOT_RUNNING / GENERATING / PROMPT / RATE_LIMIT / IDLE へ分類する（ANSI と NBSP を正規化し現ペインに限定するのでスクロールバックへ誤マッチしない）
  - 生成中・CLI 自身の backoff 中には注入せず、条件つきプロンプト承認・usage limit からの即時再開・リトライ枯渇後の上限つき再送だけを行い、上限到達でエスカレーションする
  - プロンプトへの Enter を promptData で判定し、デフォルトが承認である二択だけ承認して、契約 autoYes ポリシーの保留・デフォルト無しの選択・promptData 無しのフレームは送らずに理由つきで報告する（--no-auto-approve で全件保留）
  - 介入の宛先を capture ペイロードの cliToolId と `<worktree-id>@<instance-id>` 指定から導出し、分類したペインと入力するペインを一致させる（固定 prefix を連結しない。instance 指定は capture 側にも効く）
  - 送信前に tmux has-session で完全一致指定の存在を検証し、配信できなかった介入を握り潰さず報告する（承認カウンタと再送予算は配信時のみ進む）
  - フォールバック時は生成アンカーの観測有無と実 commit / uncommitted 数で STARTED ガード付きの完了判定を下す
  - タスク状態と完了カウンタを差し替え可能なフックとして供給し、指定 file が無ければ黙って続行せず失敗する
  - 1 ポーリング 1 行の固定フォーマットで判定とその入力を機械可読に残し、品質ゲートと依存コマンド（capture / 状態分類 / 完了判定 / git）を exit code の実測で判定して、失敗を「作業ゼロ」や「判定なし」と取り違えず原因ごとに worker 1 回だけ報告する
expected_outcomes:
  - 検証ゲート不合格の worker が COMPLETE と報告されず、マージ候補に混ざらない
  - 完了判定がサーバ側の裁定か推定かをログから区別でき、タスク状態を参照できない環境で黙って推定へ劣化することがない
  - 生成中の worker が idle と誤分類されず、思考が長い worker も停止扱いされない
  - 介入がプロンプト・usage limit・枯渇後の再送に限られ、健全な worker へ入力が注入されない
  - 実行契約が autoYes ポリシーで保留させたプロンプトや、Enter がデフォルト選択肢の確定になる選択が、監視ループのキー送出で意図せず確定されない
  - 介入が空振りのまま「送った」と記録されることがなく、claude / codex 混在でも非既定 instance でもフラグ無しで正しいペインへ届く
  - 未起動 worker や作業の痕跡が無い worker が COMPLETE と誤報されない
  - 完了フック未配線のまま「全 worker 完了」と報告されることがなく、NOT_STARTED として露見する
  - 総ポーリング数・状態分類の分布・介入と保留の全件・完了判定の根拠（started / streak / commits / uncommitted / task）が監視ログから機械的に取り出せる
  - 品質ゲートや依存コマンドの非 0 終了が「テスト緑」「作業ゼロ」の見た目に隠されない（git が答えられなかった worker が NOT_STARTED と誤報されず、判定器が落ちたポーリングが無言で素通りしない）
provider:
  name: CommandMate
  url: https://github.com/Kewton/CommandMate
license: MIT
homepage: https://github.com/Kewton/commandmate-skills
keywords:
  - monitoring
  - supervision
  - orchestration
  - worker
  - tmux
  - capture
  - completion
  - parallel
  - guard
  - bash
compatibility:
  commandmate: '>=0.15.0 <1.0.0'
  agents:
    - agent: claude
      support: native
      evidence: Measured 2026-07-26 on Claude Code 2.1.220 with CommandMate 0.15.0. An installed skill was discovered from .claude/skills and matched in the slash palette; the installer writes .agents/skills and .claude/skills byte-identically.
    - agent: codex
      support: native
      evidence: Measured 2026-07-26 on Codex CLI 0.145.0. It reads SKILL.md from .agents/skills (model self-report of the absolute path, not a mechanical trace). This version does not expose skills as slash commands; invoke by name or run the scripts.
    - agent: gemini
      support: unknown
      evidence: Not measured for this version. Readable as a procedure; discovery unverified.
    - agent: opencode
      support: unknown
      evidence: Not measured for this version. Readable as a procedure; discovery unverified.
requirements:
  commands:
    - name: bash
      version_range: '>=3.2.0'
    - name: commandmate
    - name: git
    - name: tmux
  network_hosts:
    - registry.npmjs.org
declared_permissions:
  - filesystem_read
  - filesystem_write
  - process_execution
  - network_access
declared_risk: high
risk_rationale: >-
  Ships executable scripts (high risk). Runs `commandmate capture` per poll and, with hooks wired,
  reads the task ledger and worker checkouts read-only. It types into worker panes via tmux — Enter,
  "a" and the resend message only, delivered to an existence-checked exact-match session derived
  from that poll. Enter bypasses the server's approval control, so it needs a promptData whose
  default option is affirmative; anything else is held and reported. It never sends task text or
  mutates a repo.
