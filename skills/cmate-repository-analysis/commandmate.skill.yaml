schema_version: 1
id: cmate-repository-analysis
name: cmate-repository-analysis
version: 0.2.0
summary: リポジトリをread-onlyで走査し、構造・既存実装・再利用候補・変更risk・推奨verificationをfile/line evidence付きで返す。
description: >-
  変更に着手する前の現状把握を、再現可能な標準手順にしたものである。対象リポジトリを
  read-only で走査し、構成と規約、目的に関係する既存実装、再利用できる資産、変更した
  ときに壊れうる箇所、そしてリポジトリに実在する検証手段を、すべて file と行番号の
  evidence に結び付けて返す。secret らしき値は位置と分類だけを報告し、値は要約にも
  result にも含めない。主成果物は人が読む要約で、5つの evidence 規律の check の合否を
  自身で申告するので、どこまで確かめた分析なのかを受け取った側が検証できる。構造化した
  result JSON は任意の副産物であり、その schema は advisory である。
  書き込み、command 実行、network access のいずれも行わない。
capabilities:
  - 対象リポジトリの構成・言語・entry point・build と CI 経路を evidence 付きで把握する
  - AGENTS や CLAUDE や README や CONTRIBUTING から従うべき規約を抽出する
  - 目的に関係する既存実装と再利用候補を、そのまま使えるか拡張が要るかまで含めて特定する
  - 変更したときに壊れうる箇所を severity と緩和手段付きで列挙する
  - リポジトリに実在する検証手段だけを、出典 evidence 付きで推奨する
  - secret らしき値の位置と分類を、値を持ち出さずに報告する
expected_outcomes:
  - 実装に着手する前に、影響範囲と再利用候補が file と行番号で確認できる
  - 推奨された検証手段が実在するので、そのまま実行して変更を確かめられる
  - 走査の打ち切りや未解決点が明示されるので、分析の網羅性を鵜呑みにせず判断できる
  - evidence の path と行が実在するかを機械で検査できるので、報告の妥当性を読み合わせに頼らず確かめられる
provider:
  name: CommandMate
  url: https://github.com/Kewton/CommandMate
license: MIT
homepage: https://github.com/Kewton/commandmate-skills
keywords:
  - repository-analysis
  - codebase
  - read-only
  - evidence
  - risk
  - onboarding
compatibility:
  commandmate: '>=0.11.0 <1.0.0'
  agents:
    - agent: claude
      support: native
      evidence: Measured 2026-07-26 on Claude Code 2.1.220 with CommandMate 0.15.0: an installed skill is discovered from .claude/skills and matches in the slash palette. The installer writes .agents/skills and .claude/skills byte-identically, so the path is package-independent.
    - agent: codex
      support: native
      evidence: Measured 2026-07-26 on Codex CLI 0.145.0: SKILL.md is read from .agents/skills (model self-report, not a mechanical trace). This version does not expose skills as slash commands, so invoke it by name.
    - agent: gemini
      support: unknown
      evidence: Discovery path not verified for this version
    - agent: opencode
      support: unknown
      evidence: Discovery path not verified for this version
requirements:
  commands: []
  network_hosts: []
declared_permissions:
  - filesystem_read
declared_risk: low
risk_rationale: >-
  指示文と JSON schema だけで構成され、script も実行可能 file も含まない。手順が要求する
  権限は対象リポジトリの読み取りのみで、書き込み、command 実行、network access、
  環境変数や credential の読み取りは手順として禁止している。
