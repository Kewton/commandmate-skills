schema_version: 1
id: cmate-workspace-research
name: cmate-workspace-research
version: 0.1.0
summary: 指定した複数の Agent セッションに Web と Workspace を独立に調査させ、重要な Finding を相互反証し、結論を左右する claim を追加検証して、Evidence 付きの final.md 1 本に統合する技術調査の手順。
description: |-
  ユーザーが agents と request だけを指定すると、親セッションが指定の Agent（子）に同じ調査を独立に委ね、Web と Workspace の Evidence を突き合わせて「このリポジトリにとって何を意味するか」までを 1 本の final.md にまとめる。migration / upgrade / incident / architecture / security / OSS の技術調査が対象で、コードの変更・PR・実行契約は扱わない。
  手順は preflight → FRAME → CAPABILITY PROBE → ROLE → INDEPENDENT → CROSS CHECK → TARGETED VERIFY → EVIDENCE MERGE → SYNTHESIZE である。preflight で自分を子から除外し、alias を instanceId へ解決し、子の cliTool / running / autoYes と read-only コマンドに要る権限の整え方を表にして、人に 1 回だけ選ばせる。running でない子には固定文の warm-up を送る。
  Web に出られるかは Agent に依存するので、role は probe の報告（WEB: available | unavailable）の後に決める。子への送信文は cmate-delegate の 5 欄だけの短文で、調査契約は run-dir の roles/<key>.md に書いて読ませる。子は chat で返答し、workspace には 1 byte も書かない。親は commandmate ask --json --timeout 3600 を子の数だけ背景で走らせ、exit code で分岐する。
  規律は 4 つある。Agent の一致は Evidence ではない。独立調査の間は他の子の結果を見せない。調査中に workspace を変えない（git status の前後比較を final に残す）。子の prompt に答えず（respond を打たない）、子の auto-yes を触らない（exit 10 はその子だけ止めて人へ写す）。
  final.md の What Changed Through Cross Check は修正が無くても見出しを残して「修正なし」と書く。完了しなかった子は coverage の降格として、未解決の矛盾は UNRESOLVED CONTRADICTION として残す。
capabilities:
  - agents と request だけで起動し（slash でも名前付き欄でも）、request が読めなければ子に何も送らず ambiguous_request で止まる
  - whoami / 環境変数 / tmux 逆引きで自分を特定し、自分を子に含めた指定や解決できない alias を開始前に拒否する
  - 子の cliTool / running / autoYes と、read-only コマンドに要る権限の整え方を表にして、人に 1 回だけ「整えて続行 / コマンド無しで続行」を選ばせる
  - 子の Web 到達を probe で確かめてから Workspace-first / External-first などの role を割り当て、Web が誰にも無ければ coverage を下げて続行する
  - 5 欄だけの短い送信文と role ファイルで独立調査を委ね、commandmate ask --json を背景で N 本走らせて exit code で回収する（親が Codex なら直列）
  - 結論を変えうる Finding と全員が置いている前提を選んで challenge を送り、Workspace の claim は親が自分で読み、Web の claim は Web の使える子に確かめさせる
  - Finding を WEB / WORKSPACE / DERIVED と 5 つの state で統合し、同じ URL の重複を独立 evidence として数えない
  - path:line / path::symbol と URL ＋ as-of の locator を持つ final.md を、What Changed Through Cross Check を必ず含めて書く
  - 子が exit 10 / 124 / 21 で止まっても respond も auto-yes も打たず、その子だけ止めて残りの子で final を出し、run.json に理由を残す
  - 調査の前後で git status --porcelain を比べ、workspace が変わっていれば final の Risks に記録する
expected_outcomes:
  - Web の一般論ではなく、自分の workspace の実際（依存の version・読み込み箇所・CI・Dockerfile）を踏まえた調査結果が 1 本の final.md で返る
  - 複数の Agent を使ったことで初期分析の何が修正されたかが、What Changed Through Cross Check として毎回残る
  - Agent 同士の一致や多数決が、結論の根拠として扱われない
  - 全員が共有していた誤った前提が、一致したという理由で見逃されにくくなる
  - 未検証の claim が、検証済みの事実と同じ強さで書かれない
  - 子が権限ダイアログで止まっても、親が勝手に承認せず、残りの子で調査が続く
  - 調査中に workspace が変更されたかどうかが、後から確かめられる
  - Web に出られない子へ Web 役が割り当てられない
